name: Install CleanICE Website

on:
  push:
    paths:
      - 'CleanICE_Beauty_Website.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract CleanICE website
        shell: bash
        run: |
          set -euo pipefail
          test -f CleanICE_Beauty_Website.zip
          rm -rf /tmp/cleanice-site
          mkdir -p /tmp/cleanice-site
          unzip -q -o CleanICE_Beauty_Website.zip -d /tmp/cleanice-site
          test -f /tmp/cleanice-site/final_site/index.html
          test -f /tmp/cleanice-site/final_site/styles.css
          test -f /tmp/cleanice-site/final_site/script.js
          test -d /tmp/cleanice-site/final_site/assets
          rm -rf assets
          cp -a /tmp/cleanice-site/final_site/assets ./assets
          cp -f /tmp/cleanice-site/final_site/index.html ./index.html
          cp -f /tmp/cleanice-site/final_site/styles.css ./styles.css
          cp -f /tmp/cleanice-site/final_site/script.js ./script.js
          if [ -f /tmp/cleanice-site/final_site/README.md ]; then
            cp -f /tmp/cleanice-site/final_site/README.md ./README.md
          fi
          rm -rf .siteparts .sitezip
          echo "Assets installed: $(find assets -type f | wc -l)"
          test "$(find assets -type f | wc -l)" -eq 41

      - name: Commit installed website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Install CleanICE Beauty website from source ZIP"
            git push origin HEAD:main
          fi
